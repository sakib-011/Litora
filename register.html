<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account · Litora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="register">
    <main class="auth-page">
        <section class="glass auth-card">
            <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-book-bookmark icon"></i></span>Litora</a>
            <div>
                <h1>Create your account</h1>
                <p class="muted center">It takes less than a minute.</p>
            </div>
            <form id="registerForm" class="auth-form" novalidate>
                <div class="form-alert" role="alert" hidden></div>
                <div class="field">
                    <label for="regName">Full name</label>
                    <input id="regName" class="input" type="text" autocomplete="name" placeholder="Enter your full name" required>
                    <span class="field-error" id="regNameError" role="alert"></span>
                </div>
                <div class="field">
                    <label for="regEmail">Email address</label>
                    <input id="regEmail" class="input" type="email" autocomplete="email" placeholder="Enter your email address" required>
                    <span class="field-error" id="regEmailError" role="alert"></span>
                </div>
                <div class="field">
                    <label for="regPassword">Password</label>
                    <div class="password-wrap">
                        <input id="regPassword" class="input" type="password" autocomplete="new-password" placeholder="Create a strong password (8+ chars)" required>
                        <button type="button" class="password-toggle" data-toggle-password="regPassword" aria-label="Show password" title="Toggle password visibility">
                            <i class="fa-solid fa-eye icon"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="regPasswordStrength" hidden>
                        <div class="strength-bar"><div class="strength-fill" id="regStrengthFill"></div></div>
                        <span class="strength-text" id="regStrengthText"></span>
                    </div>
                    <span class="field-error" id="regPasswordError" role="alert"></span>
                </div>
                <div class="field">
                    <label for="regConfirm">Confirm password</label>
                    <div class="password-wrap">
                        <input id="regConfirm" class="input" type="password" autocomplete="new-password" placeholder="Confirm your password" required>
                        <button type="button" class="password-toggle" data-toggle-password="regConfirm" aria-label="Show password" title="Toggle password visibility">
                            <i class="fa-solid fa-eye icon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="regConfirmError" role="alert"></span>
                </div>
                <button class="btn btn-primary" id="registerBtn" type="submit">
                    <i class="fa-solid fa-user-plus icon"></i> Create account
                </button>
            </form>
            <div class="auth-notice" id="registerSuccess" hidden>
                <i class="fa-solid fa-envelope-circle-check icon-big"></i>
                <h1>Check your email</h1>
                <p class="muted">We sent a confirmation link to <strong id="registerSuccessEmail"></strong>. Open it, then log in.</p>
                <a class="btn btn-primary" href="login.html">Go to log in</a>
            </div>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
