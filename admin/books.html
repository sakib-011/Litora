<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Books · Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/books.css">
</head>
<body class="guarded">

    <div id="siteNav"></div>

    <div class="admin-shell">
        <aside class="sidebar" id="adminSidebar" aria-label="Admin navigation"></aside>

        <main class="admin-main">
            <div class="page-head">
                <div>
                    <h1>Books</h1>
                    <p class="muted">Search, filter and manage every book, including drafts.</p>
                </div>
                <a class="btn btn-primary" href="add-book.html"><i class="fa-solid fa-plus icon"></i> Add book</a>
            </div>

            <div class="glass toolbar" role="search">
                <div class="toolbar-search">
                    <i class="fa-solid fa-magnifying-glass icon"></i>
                    <input class="input" id="searchInput" type="search" placeholder="Search title, author or category" aria-label="Search books" autocomplete="off">
                </div>
                <select class="input" id="categoryFilter" aria-label="Filter by category">
                    <option value="">All categories</option>
                </select>
                <select class="input" id="statusFilter" aria-label="Filter by status">
                    <option value="">All statuses</option>
                    <option value="published">Published</option>
                    <option value="draft">Draft</option>
                </select>
                <select class="input" id="sortSelect" aria-label="Sort books">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="updated">Recently updated</option>
                    <option value="title_asc">Title A–Z</option>
                    <option value="title_desc">Title Z–A</option>
                    <option value="author_asc">Author A–Z</option>
                </select>
                <div class="view-toggle" role="group" aria-label="View">
                    <button class="btn btn-icon" id="viewGrid" type="button" aria-pressed="true" aria-label="Grid view"><i class="fa-solid fa-border-all icon"></i></button>
                    <button class="btn btn-icon" id="viewTable" type="button" aria-pressed="false" aria-label="Table view"><i class="fa-solid fa-table-list icon"></i></button>
                </div>
            </div>

            <p class="muted result-count" id="resultCount" aria-live="polite"></p>
            <div id="bookResults"></div>
            <nav class="pager" id="bookPager" aria-label="Pagination"></nav>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cloudinary.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/books.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        (async () => {
            UI.renderNavbar("");
            Admin.initShell("books");
            UI.initSidebar();
            await Auth.initNav();

            const profile = await Auth.requireAdmin();
            if (profile) Admin.initBooksPage();
        })();
    </script>
</body>
</html>
