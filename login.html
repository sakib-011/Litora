<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in · Litora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login">
    <main class="auth-page">
        <section class="glass auth-card">
            <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-book-bookmark icon"></i></span>Litora</a>
            <div>
                <h1>Welcome back</h1>
                <p class="muted center">Log in to read and download books.</p>
            </div>
            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-alert" role="alert" hidden></div>
                <div class="field">
                    <label for="loginEmail">Email address</label>
                    <input id="loginEmail" class="input" type="email" autocomplete="email" placeholder="Enter your email address" required>
                    <span class="field-error" id="loginEmailError" role="alert"></span>
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <div class="password-wrap">
                        <input id="loginPassword" class="input" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" data-toggle-password="loginPassword" aria-label="Show password" title="Toggle password visibility">
                            <i class="fa-solid fa-eye icon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="loginPasswordError" role="alert"></span>
                </div>
                <button class="btn btn-primary" id="loginBtn" type="submit">
                    <i class="fa-solid fa-right-to-bracket icon"></i> Log in
                </button>
            </form>
            <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
